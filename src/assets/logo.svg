<svg width="320" height="65" viewBox="0 0 320 65" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-main-text { font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 22px; }
      .logo-sub-text { font-family: 'Inter', 'Nunito', -apple-system, sans-serif; font-weight: 400; font-size: 10px; }
    </style>
  </defs>
  
  <!-- Main Text: "Köyümüzden Sofranıza" -->
  <text x="160" y="35" class="logo-main-text" fill="#2F4A2F" text-anchor="middle" letter-spacing="0.2">Köyümüzden Sofranıza</text>
  
  <!-- Sub Text: "Doğal Köy Ürünleri" -->
  <text x="160" y="52" class="logo-sub-text" fill="#4F6F52" text-anchor="middle" letter-spacing="1" opacity="0.85">Doğal Köy Ürünleri</text>
</svg>
