<svg width="200" height="240" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap');
      .logo-main-text { 
        font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif; 
        font-weight: 600; 
        font-size: 32px;
      }
      .logo-sub-text { 
        font-family: 'Inter', 'Nunito', -apple-system, sans-serif; 
        font-weight: 400; 
        font-size: 12px;
      }
    </style>
  </defs>
  
  <!-- Olive Branch Icon - Stacked/Vertical -->
  <g transform="translate(100, 40)">
    <!-- Main stem -->
    <path d="M 0 -10 L 0 10" stroke="#4F6F52" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top leaf -->
    <path d="M 0 -8 Q -4 -10 -4 -6 Q -2 -8 0 -8" stroke="#4F6F52" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Middle left leaf -->
    <path d="M 0 0 Q -4 2 -4 6 Q -2 4 0 0" stroke="#4F6F52" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Middle right leaf -->
    <path d="M 0 0 Q 4 2 4 6 Q 2 4 0 0" stroke="#4F6F52" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Main Text: "Köyümüzden Sofranıza" -->
  <text x="100" y="100" 
        class="logo-main-text"
        fill="#2F4A2F" 
        text-anchor="middle" 
        letter-spacing="0.6">
    Köyümüzden
  </text>
  <text x="100" y="130" 
        class="logo-main-text"
        fill="#2F4A2F" 
        text-anchor="middle" 
        letter-spacing="0.6">
    Sofranıza
  </text>
  
  <!-- Sub Text: "Doğal Köy Ürünleri" -->
  <text x="100" y="160" 
        class="logo-sub-text"
        fill="#4F6F52" 
        text-anchor="middle" 
        letter-spacing="1.5"
        opacity="0.85">
    Doğal Köy Ürünleri
  </text>
</svg>

